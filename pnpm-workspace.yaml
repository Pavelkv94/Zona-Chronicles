packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'

# Детерминированная установка: agent-сессии и CI не меняют граф зависимостей молча.
engineStrict: true
saveExact: true
resolutionMode: highest

# Lifecycle scripts зависимостей — исполняемый код (ADR-008).
# Решение по каждому пакету принимается явно; молчаливого «игнора» быть не должно.
allowBuilds:
  esbuild: true
  turbo: true
  cpu-features: false
  protobufjs: false
  ssh2: false

# Транзитивные версии, поднятые ПОД УЯЗВИМОСТЬ, а не ради свежести.
#
# `fast-uri` приходит из графа fastify/ajv двумя мажорами сразу и в обоих оказался уязвим
# (GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf, GHSA-jqff-g426-hqxp — четыре
# high, все про подмену хоста и SSRF при разборе URI). Прямой зависимостью он не является, поэтому
# поднять его иначе, чем override-ом, нельзя: ждать выпуска fastify значит держать gate красным
# по чужому расписанию.
#
# Диапазон — минимальный исправленный, а не `latest`: override обязан закрывать НАЗВАННУЮ
# уязвимость, а не незаметно тащить граф вперёд.
#
# Ключ без версии, хотя пакет приходил двумя мажорами сразу. Попытка развести их ключами
# `fast-uri@3` / `fast-uri@4` не сработала и сработать не могла: такой ключ сопоставляется с
# ДИАПАЗОНОМ, который объявил потребитель, а ajv объявляет объединение мажоров — под оба ключа
# оно не подходит, и в графе оставалась уязвимая 4.1.2. Проверено исполнением, а не прочтением
# документации.
overrides:
  fast-uri: '>=4.1.3'

# Общие версии, которые обязаны совпадать между contracts, api и будущими потребителями.
# Иначе TypeBox-схемы и type provider разъезжаются по версиям (риск, зафиксированный на review I00).
catalog:
  '@sinclair/typebox': 0.34.52
