packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'

# Детерминированная установка: agent-сессии и CI не меняют граф зависимостей молча.
engineStrict: true
saveExact: true
resolutionMode: highest

# Lifecycle scripts зависимостей — исполняемый код (ADR-008).
# Решение по каждому пакету принимается явно; молчаливого «игнора» быть не должно.
allowBuilds:
  esbuild: true
  turbo: true
  cpu-features: false
  protobufjs: false
  ssh2: false

# Общие версии, которые обязаны совпадать между contracts, api и будущими потребителями.
# Иначе TypeBox-схемы и type provider разъезжаются по версиям (риск, зафиксированный на review I00).
catalog:
  '@sinclair/typebox': 0.34.52
