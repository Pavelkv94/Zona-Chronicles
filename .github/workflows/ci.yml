# Provider-neutral CI: каждый шаг — это документированная команда репозитория.
# Смена CI-провайдера не должна менять состав gate (ADR-008).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  TZ: UTC
  LANG: C.UTF-8

jobs:
  gate:
    name: PR gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # ВНИМАНИЕ: этот workflow НИКОГДА НЕ ИСПОЛНЯЛСЯ. На момент I03 `origin/main` стоит на первом
    # коммите репозитория, ни одна ветка с работой не отправлена, и запусков CI не было. Всё
    # ниже — не проверенный контроль, а заявка на него. Это записано в `REVIEW.md` итерации I03
    # как находка, а не как выполненный пункт: Gate A требует «CI стабилен минимум на 10
    # последовательных запусках», и до первого зелёного прогона этот пункт не выполнен.
    #
    # I03 нашёл в нём два дефекта, из-за которых он не мог пройти в принципе:
    #   1) PostgreSQL не поднимался вовсе, а `test:integration`/`test:acceptance` подключаются к
    #      localhost:5432 под ролью `zona` (`__fixtures__/test-database.ts`);
    #   2) `pnpm test:e2e` отсутствовал — единственная проверка ЦЕПОЧКИ до браузера, ради которой
    #      итерация и делалась, не запускалась автоматически ни разу.
    services:
      postgres:
        # Тот же образ и та же фиксация локали/таймзоны, что в `docker-compose.yml`: расхождение
        # среды CI и локальной среды означало бы, что детерминизм (SIM-01) проверяется в одной
        # среде, а обещается в другой.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: zona
          # Задокументированная локальная заглушка (`security/policy.json`,
          # non_secret_placeholders): контейнер одноразовый и снаружи недоступен.
          POSTGRES_PASSWORD: zona_local_dev_only
          POSTGRES_DB: zona
          TZ: UTC
          PGTZ: UTC
          LANG: C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zona -d zona"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
        with:
          # M-3 (раунд 3): без полной истории `ownership:check` падает на резолве
          # base-коммита (`fatal: Needed a single revision`), то есть шаг краснел бы
          # по причине, не связанной с владением, — приглашение «починить» его
          # ослаблением. Контроль обязан падать только по своей причине.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: corepack enable

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      # Порядок повторяет §8 08_TDD_AND_AGENT_WORKFLOW.
      - run: pnpm format:check

      # BUILD ИДЁТ ПЕРВЫМ, и это выяснено дважды на разной цене.
      #
      # BL-1 (независимый архитектурный аудит I02A): acceptance порождает CLI отдельным OS-
      # процессом (`node apps/cli/src/main.ts`), на который alias-ы vitest не действуют: он
      # резолвит `@zona/*` по `exports` пакета, то есть в `dist`. `dist` в .gitignore,
      # lifecycle-скрипта сборки нет, поэтому на чистом checkout acceptance падал бы с
      # ERR_MODULE_NOT_FOUND. Тогда build подняли выше acceptance.
      #
      # M4 (независимый архитектурный аудит I04-I06): того подъёма НЕ ХВАТИЛО. `eslint`
      # резолвит внутренние пакеты через project references, а пакет, которого нет в
      # references потребителя, — через `exports` в `dist/index.d.ts`. На чистом checkout типы
      # становятся `any`, и `no-unsafe-argument` даёт три ошибки в `apps/worker/src/
      # world-bundles.ts`. То есть CI был красным на ПЕРВОМ же шаге у любого, кто клонировал
      # репозиторий, — и незаметен ровно потому, что у всех, кто его запускал, `dist` уже был.
      # Сама недостающая reference на `packages/content` починена отдельно; порядок здесь
      # закрывает КЛАСС, а не случай: ни один шаг gate не должен зависеть от того, собирал ли
      # кто-то дерево раньше.
      - run: pnpm build

      - run: pnpm lint
      - run: pnpm boundaries:check
      - run: pnpm typecheck

      - run: pnpm test:unit
      - run: pnpm test:property
      - run: pnpm test:contract
      - run: pnpm test:acceptance
      - run: pnpm test:integration
      - run: pnpm test:replay

      # E2E ставится ПОСЛЕ остальных наборов: он поднимает весь стек (миграции, мир, три
      # процесса, браузер) и потому самый дорогой и самый шумный при падении. Браузер ставится
      # отдельным шагом — Playwright не тянет его вместе с пакетом.
      - name: Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      # Security-сканы стоят ПОСЛЕ build намеренно и это безопасно с I03: обход исходников
      # пропускает директории, начинающиеся с точки, поэтому сборочный вывод (`apps/web/.next`)
      # в него не попадает. До этой правки порядок решал вердикт: на чистом дереве скан проходил,
      # после build — падал 54 находками в минифицированных чанках.
      - run: pnpm security:secrets
      - run: pnpm security:dependencies
      - run: pnpm security:licenses
      - run: pnpm security:static
      - run: pnpm security:no-llm

      # DEV-02: контроль владения на уровне результата переживает порчу session-level
      # настроек агента, поэтому повторяется вне агентной сессии.
      #
      # M-3 (раунд 3): раньше шаг был ограничен `pull_request`, поэтому прямые push
      # в main не проверялись вовсе, а на PR он падал из-за shallow checkout — то есть
      # не отработал ни разу. Теперь база берётся по типу события.
      - name: Task ownership vs declared write sets
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # Каталог, а не одна карта: F5-4 закрыт — overlap считается конфликтом только
          # внутри одного iteration_id, между итерациями пересечение легитимно.
          # Оговорка: при пересечении между картами владелец в ОТЧЁТЕ выбирается
          # детерминированно по порядку файлов и может назвать задачу прошлой итерации.
          # Это влияет только на строку отчёта; обнаружение нарушений и проверка
          # protected-path не зависят от выбора (F5-3: точная атрибуция в общем
          # рабочем дереве недостижима).
          # База, ПРЕДШЕСТВУЮЩАЯ появлению harness, — отдельный случай, а не нарушение.
          #
          # Найдено при подготовке первого прогона: `origin/main` стоит на первом коммите
          # репозитория, каталога задач в нём нет, и шаг падал с exit 2. Это не ownership
          # violation — это база, относительно которой владение НЕ ОПРЕДЕЛЕНО: ни одна задача
          # в ней не объявлена, значит и выйти за её пределы никто не мог.
          #
          # Пропуск СУЖЕН до ровно этого условия и ГРОМКИЙ. Он не срабатывает, когда каталог в
          # базе есть: тогда шаг исполняется и падает по своей причине, как и задумано. Условие
          # проверяется у git-объекта базы, а не на диске, — по тому же доводу, что и сама
          # проверка (подмена рабочего дерева не должна влиять на вердикт).
          if git cat-file -e "$BASE:.claude/tasks" 2>/dev/null; then
            pnpm ownership:check .claude/tasks "$BASE"
          else
            echo "::warning title=Ownership check skipped::В базе $BASE нет .claude/tasks — владение относительно неё не определено, проверять нечего. Пропуск действует ТОЛЬКО для баз, предшествующих появлению harness."
          fi

      # p-2/p-3 аудита I02A: golden-реестр миграций живёт в том же дереве, что и сами
      # миграции, поэтому «красный тест» чинится правкой литерала. Здесь базовая линия
      # берётся ИЗВНЕ дерева — из git-объекта базового коммита.
      - name: Released migrations are immutable
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          pnpm migrations:immutable "$BASE"

      - name: Upload machine-readable reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: reports/
          if-no-files-found: ignore
