# Provider-neutral CI: каждый шаг — это документированная команда репозитория.
# Смена CI-провайдера не должна менять состав gate (ADR-008).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  TZ: UTC
  LANG: C.UTF-8

jobs:
  gate:
    name: PR gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # M-3 (раунд 3): без полной истории `ownership:check` падает на резолве
          # base-коммита (`fatal: Needed a single revision`), то есть шаг краснел бы
          # по причине, не связанной с владением, — приглашение «починить» его
          # ослаблением. Контроль обязан падать только по своей причине.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: corepack enable

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      # Порядок повторяет §8 08_TDD_AND_AGENT_WORKFLOW.
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm boundaries:check
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:property
      - run: pnpm test:contract
      - run: pnpm test:integration
      - run: pnpm test:replay
      - run: pnpm security:secrets
      - run: pnpm security:dependencies
      - run: pnpm security:licenses
      - run: pnpm security:static
      - run: pnpm security:no-llm
      - run: pnpm build

      # DEV-02: контроль владения на уровне результата переживает порчу session-level
      # настроек агента, поэтому повторяется вне агентной сессии.
      #
      # M-3 (раунд 3): раньше шаг был ограничен `pull_request`, поэтому прямые push
      # в main не проверялись вовсе, а на PR он падал из-за shallow checkout — то есть
      # не отработал ни разу. Теперь база берётся по типу события.
      - name: Task ownership vs declared write sets
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # Каталог, а не одна карта: F5-4 закрыт — overlap считается конфликтом только
          # внутри одного iteration_id, между итерациями пересечение легитимно.
          # Оговорка: при пересечении между картами владелец в ОТЧЁТЕ выбирается
          # детерминированно по порядку файлов и может назвать задачу прошлой итерации.
          # Это влияет только на строку отчёта; обнаружение нарушений и проверка
          # protected-path не зависят от выбора (F5-3: точная атрибуция в общем
          # рабочем дереве недостижима).
          pnpm ownership:check .claude/tasks "$BASE"

      - name: Upload machine-readable reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: reports/
          if-no-files-found: ignore
