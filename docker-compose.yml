# Локальная среда прототипа (ADR-002): postgres, worker, api, web.
#
# Разделение ролей БД (ADR-008, §11 03_TECHNICAL_DESIGN) выполняется миграциями
# и грантами в I02A; здесь заведён только superuser для локальной разработки.
services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: zona-postgres
    environment:
      POSTGRES_USER: zona
      POSTGRES_PASSWORD: zona_local_dev_only
      POSTGRES_DB: zona
      # Детерминизм (SIM-01): локаль и таймзона контейнера фиксированы.
      TZ: UTC
      PGTZ: UTC
      LANG: C.UTF-8
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - lc_messages=C
      # Полный gate поднимает много независимых соединений: у каждого набора свои базы, свои
      # пулы и порождённые CLI-процессы. С умолчанием в 100 клиентов цепочка
      # `verify && integration && replay && acceptance` дважды падала отказом
      # `sorry, too many clients already`, и падение выглядело как дефект теста: наборы
      # проходили поодиночке и падали в цепочке. Измерено, а не предположено — отказ снят
      # исполнением после того, как две сессии работали против одного сервера.
      #
      # Это ЛОКАЛЬНАЯ среда разработки, а не поставка: предел поднят там, где он мешает
      # прогонять контроль, и не является утверждением о продукте.
      - -c
      - max_connections=300
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zona -d zona']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: ops/Dockerfile
      target: api
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3001'
      # I03: переменная называется PROJECTION_DATABASE_URL, а не DATABASE_URL, и это не
      # переименование. Observer API ходит в ХРАНИЛИЩЕ ПРОЕКЦИИ; одинаковое имя переменной
      # означало бы, что «та же строка подключения годится обоим», и запрет на чтение
      # канонических таблиц держался бы на договорённости вместо грантов (D5).
      #
      # До этой правки здесь стоял DATABASE_URL, который apps/api с I03 не читает вовсе:
      # контейнер не поднялся бы — parseConfig отвергает отсутствие PROJECTION_DATABASE_URL
      # (и правильно: сервис, отвечающий пустотой, неотличим от работающего с пустым миром).
      PROJECTION_DATABASE_URL: postgres://zona_api:zona_local_dev_only@postgres:5432/zona
      ALLOWED_ORIGINS: http://localhost:3100
      DEPLOYMENT_ID: local-compose
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['app']

  worker:
    build:
      context: .
      dockerfile: ops/Dockerfile
      target: worker
    environment:
      NODE_ENV: production
      # BL-2: canonical worker — роль без DDL и без update/delete на world_events.
      DATABASE_URL: postgres://zona_worker:zona_local_dev_only@postgres:5432/zona
      # Миграции — единственное, что идёт под владельцем схемы.
      MIGRATION_DATABASE_URL: postgres://zona:zona_local_dev_only@postgres:5432/zona
      # I03: worker собирает проекцию и делает это под СВОЕЙ ролью — `zona_projection` читает
      # журнал и владеет `projection_*`, но писать историю не может. Три роли, три строки.
      PROJECTION_DATABASE_URL: postgres://zona_projection:zona_local_dev_only@postgres:5432/zona
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['app']

  # I03: экран наблюдателя. Комментарий в шапке обещал его «в I03» — обещание выполнено здесь.
  web:
    build:
      context: .
      dockerfile: ops/Dockerfile
      target: web
    environment:
      NODE_ENV: production
      # Адрес API приходит в РАНТАЙМЕ, а не на сборке. Next подставляет значения из `env`
      # конфига в клиентский бандл во время build, поэтому собранный образ иначе навсегда
      # запомнил бы адрес машины, на которой его собрали.
      ZONA_API_BASE_URL: http://localhost:3001
    ports:
      - '3100:3100'
    depends_on:
      - api
    profiles: ['app']

volumes:
  postgres-data:
